---
- name: Apply ceph-ansible HEAD codebase to cluster
  ansible.builtin.import_playbook: ../../site.yml.sample
  vars:
    no_log_on_ceph_key_tasks: false
    yes_i_know: true
    ceph_stable_release: "{{ lookup('ansible.builtin.env', 'CEPH_INITIAL_RELEASE', default=lookup('ansible.builtin.env', 'CEPH_STABLE_RELEASE', default='squid')) }}"
