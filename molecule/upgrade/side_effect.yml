---
- name: Rolling upgrade Ceph daemons
  when:
    - lookup('ansible.builtin.env', 'CEPH_INITIAL_RELEASE', default='squid') != ceph_stable_release
  ansible.builtin.import_playbook: ../../infrastructure-playbooks/rolling_update.yml
  vars:
    i_really_mean_it: true
    ceph_stable_release: >-
      {{
        lookup('ansible.builtin.env', 'CEPH_TARGET_RELEASE', default=lookup('ansible.builtin.env', 'CEPH_STABLE_RELEASE', default='squid'))
      }}

- name: Mark rolling update as completed
  hosts: mons
  gather_facts: false
  tasks:
    - name: Touch rolling update sentinel flag
      ansible.builtin.file:
        path: /etc/ceph/.rolling_update_done
        state: touch
        mode: '0644'
