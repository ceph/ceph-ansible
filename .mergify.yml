pull_request_rules:
# Backports
  - actions:
      backport:
        branches:
          - stable-3.0
    conditions:
      - label=backport-stable-3.0
    name: backport stable-3.0
  - actions:
      backport:
        branches:
          - stable-3.1
    conditions:
      - label=backport-stable-3.1
    name: backport stable-3.1
  - actions:
      backport:
        branches:
          - stable-3.2
    conditions:
      - label=backport-stable-3.2
    name: backport stable-3.2
  - actions:
      backport:
        branches:
          - stable-4.0
    conditions:
      - label=backport-stable-4.0
    name: backport stable-4.0
  - actions:
      backport:
        branches:
          - stable-5.0
    conditions:
      - label=backport-stable-5.0
    name: backport stable-5.0
  - actions:
      backport:
        branches:
          - stable-6.0
    conditions:
      - label=backport-stable-6.0
    name: backport stable-6.0
  - actions:
      backport:
        branches:
          - stable-7.0
    conditions:
      - label=backport-stable-7.0
    name: backport stable-7.0
  - actions:
      backport:
        branches:
          - stable-8.0
    conditions:
      - label=backport-stable-8.0
    name: backport stable-8.0
  - actions:
      backport:
        branches:
          - stable-9.0
    conditions:
      - label=backport-stable-9.0
    name: backport stable-9.0
commands_restrictions:
  backport:
    conditions:
      - base=main
      - number<0
queue_rules:
  - name: default
    batch_size: 1
    max_checks_retries: 0
    queue_conditions: &conditions
      - "#approved-reviews-by>=1"
      - "#check-failure=0"
      - "#check-pending=0"
      - "#check-success>=1"
    merge_conditions: *conditions
merge_queue:
  max_parallel_checks: 1
  mode: serial
