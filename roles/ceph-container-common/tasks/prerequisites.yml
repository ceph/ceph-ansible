---
- name: Remove ceph udev rules
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /usr/lib/udev/rules.d/95-ceph-osd.rules
    - /usr/lib/udev/rules.d/60-ceph-by-parttypeuuid.rules

- name: Ensure tmpfiles.d is present
  ansible.builtin.lineinfile:
    path: /etc/tmpfiles.d/ceph-common.conf
    line: "d /run/ceph 0755 {{ ceph_uid }} {{ ceph_uid }} -"
    owner: root
    group: root
    mode: "0644"
    state: present
    create: true
  register: _ceph_tmpfiles_conf

- name: Apply tmpfiles.d configuration  # noqa: no-handler
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/ceph-common.conf
  when: _ceph_tmpfiles_conf is changed
  changed_when: false

- name: Restore certificates selinux context
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - inventory_hostname in groups.get(mon_group_name, [])
      or inventory_hostname in groups.get(rgw_group_name, [])
  ansible.builtin.command: /usr/sbin/restorecon -RF /etc/pki/ca-trust/extracted
  changed_when: false

- name: Install python3 on osd nodes
  ansible.builtin.package:
    name: python3
    state: present
  when:
    - inventory_hostname in groups.get(osd_group_name, [])
    - ansible_facts['os_family'] == 'RedHat'
