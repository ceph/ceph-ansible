---
- name: Uninstall old docker versions
  ansible.builtin.package:
    name: ['docker', 'docker-engine', 'docker.io', 'containerd', 'runc']
    state: absent
  when: container_package_name == 'docker-ce'

- name: Allow apt to use a repository over https (debian)
  ansible.builtin.package:
    name: ['apt-transport-https', 'ca-certificates', 'gnupg', 'python3-debian']
    update_cache: true
  register: result
  until: result is succeeded

- name: Clean up legacy repository config not in deb822 format
  vars:
    _ceph_docker_apt_repo_legacy_list: >-
      {{
        ceph_docker_ce_repo_uri
        | regex_replace('^https?://', '')
        | regex_replace('[^a-zA-Z0-9]', '_')
      }}
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ _ceph_docker_apt_repo_legacy_list }}.list"
    state: absent
  when: container_package_name == 'docker-ce'

- name: Add docker repository
  ansible.builtin.deb822_repository:
    architectures: "{{ ceph_architecture_mapping.get(ansible_facts['architecture']) }}"
    name: docker-ce
    components: stable
    enabled: true
    signed_by: "{{ ceph_docker_ce_repo_gpg }}"
    state: present
    suites: "{{ ansible_facts['distribution_release'] }}"
    uris: "{{ ceph_docker_ce_repo_uri }}"
  when: container_package_name == 'docker-ce'
