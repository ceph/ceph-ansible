---
# ceph-common is always installed, if a package isn't to be installed we replace
# it with 'ceph-common' and run the install with the | unique filter.
debian_ceph_pkgs:
  - "ceph"
  - "ceph-common"
  - "{{ (osd_group_name in group_names) | ternary('ceph-volume', 'ceph-common') }}"
  - "{{ (ceph_test | bool) | ternary('ceph-test', 'ceph-common') }}"
  - "{{ (rgw_group_name in group_names) | ternary('radosgw', 'ceph-common') }}"
  - "{{ (rbdmirror_group_name in group_names) | ternary('ceph-base', 'ceph-common') }}"

redhat_ceph_pkgs:
  - "{{ (ceph_test | bool) | ternary('ceph-test', 'ceph-common') }}"
  - "ceph-common"
  - "{{ (mon_group_name in group_names) | ternary('ceph-mon', 'ceph-common') }}"
  - "{{ (osd_group_name in group_names) | ternary('ceph-osd', 'ceph-common') }}"
  - "{{ (osd_group_name in group_names) | ternary('ceph-volume', 'ceph-common') }}"
  - "{{ (client_group_name in group_names) | ternary('ceph-fuse', 'ceph-common') }}"
  - "{{ (client_group_name in group_names) | ternary('ceph-base', 'ceph-common') }}"
  - "{{ (rgw_group_name in group_names) | ternary('ceph-radosgw', 'ceph-common') }}"
  - "{{ (rbdmirror_group_name in group_names) | ternary('ceph-base', 'ceph-common') }}"

suse_ceph_pkgs:
  - "{{ (ceph_test | bool) | ternary('ceph-test', 'ceph-common') }}"
  - "ceph-common"
  - "{{ (mon_group_name in group_names) | ternary('ceph-mon', 'ceph-common') }}"
  - "{{ (osd_group_name in group_names) | ternary('ceph-osd', 'ceph-common') }}"
  - "{{ (osd_group_name in group_names) | ternary('ceph-volume', 'ceph-common') }}"
  - "{{ (client_group_name in group_names) | ternary('ceph-fuse', 'ceph-common') }}"
  - "{{ (client_group_name in group_names) | ternary('ceph-base', 'ceph-common') }}"
  - "{{ (rgw_group_name in group_names) | ternary('ceph-radosgw', 'ceph-common') }}"
  - "{{ (rbdmirror_group_name in group_names) | ternary('ceph-base', 'ceph-common') }}"

_ceph_rpm_repository_gpg_keys:
  community: "{{ ceph_stable_key }}"
  custom: "{{ ceph_custom_key | default('') }}"
  dev: ""
  epel: "{{ ceph_epel_key }}"

_ceph_rpm_repos:
  community:
    - name: ceph_stable
      description: Ceph Stable $basearch repo
      baseurl: "{{ ceph_mirror }}/rpm-{{ ceph_stable_release }}/el{{ ansible_facts['distribution_major_version'] }}/$basearch"
      file: ceph_stable
      priority: 2
    - name: ceph_stable_noarch
      description: Ceph Stable noarch repo
      baseurl: "{{ ceph_mirror }}/rpm-{{ ceph_stable_release }}/el{{ ansible_facts['distribution_major_version'] }}/noarch"
      file: ceph_stable
      priority: 2
  dev:
    - name: ceph-dev
      description: Ceph Dev $basearch repo
      baseurl: "{{ (((_ceph_uri_rpm_repo.get('content', '[]') | from_json | first).get('url', '')) ~ '$basearch') if ceph_repository == 'dev' else '' }}"
      file: ceph-dev
      priority: 2
    - name: ceph-dev-noarch
      description: Ceph Dev noarch repo
      baseurl: "{{ (((_ceph_uri_rpm_repo.get('content', '[]') | from_json | first).get('url', '')) ~ 'noarch') if ceph_repository == 'dev' else '' }}"
      file: ceph-dev
      priority: 2
  epel:
    - name: epel-ceph
      baseurl: >-
        {{
          ceph_epel_mirror ~
          '/' ~ ansible_facts['distribution_major_version'] ~
          (ansible_facts['distribution_major_version'] | int >= 10 and ansible_facts['distribution'] | lower != 'centos') | ternary('z', '') ~
          '/Everything/' ~ ansible_facts['architecture']
        }}
      description: "Extra Packages for Enterprise Linux $releasever - $basearch"
      file: ceph-epel
      gpgkey: "{{ ceph_epel_key }}"
      gpgcheck: true
      enabled: true
      state: present
