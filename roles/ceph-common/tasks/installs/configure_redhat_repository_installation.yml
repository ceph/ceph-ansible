---
- name: Install python3-packaging
  ansible.builtin.package:
    name: python3-packaging
    enablerepo: powertools
    state: present
  when: ansible_facts['distribution_major_version'] | int < 9

- name: Install yum plugin priorities
  ansible.builtin.package:
    name: yum-plugin-priorities
  register: result
  until: result is succeeded
  tags: with_pkg
  when: ansible_facts['distribution_major_version'] | int == 7

- name: Configure gpg keys for repositories
  ansible.builtin.rpm_key:
    key: "{{ item }}"
    state: present
  register: result
  until: result is succeeded
  when:
    - item | length > 0
  loop:
    - "{{ _ceph_rpm_repository_gpg_keys[ceph_repository] }}"
    - "{{ _ceph_rpm_repository_gpg_keys['epel'] }}"

- name: Fetch ceph redhat development repository
  vars:
    _ceph_repo_uri:
      dev: https://shaman.ceph.com/api/search/?status=ready&project=ceph&flavor=default&distros={{ ansible_facts['distribution'] | lower }}%2F{{ ansible_facts['distribution_major_version'] }}%2F{{ ansible_facts['architecture'] }}&sha1={{ ceph_dev_sha1 }}&ref={{ ceph_dev_branch }} # noqa: yaml[line-length]
      custom: "{{ ceph_custom_repo }}"
  ansible.builtin.uri:
    url: "{{ _ceph_repo_uri[ceph_repository] }}"
    return_content: true
  register: _ceph_uri_rpm_repo
  when:
    - ceph_repository in ['dev', 'custom']

- name: Configure red hat ceph repositories
  ansible.builtin.yum_repository:
    name: "{{ item.name }}"
    baseurl: "{{ item.baseurl }}"
    file: "{{ item.file | default(omit) }}"
    description: "{{ item.description | default(omit) }}"
    gpgcheck: "{{ item.gpgcheck | default(_ceph_rpm_repository_gpg_keys[ceph_repository] | length > 0) }}"
    gpgkey: "{{ item.gpgkey | default(_ceph_rpm_repository_gpg_keys[ceph_repository]) }}"
    state: present
    priority: "{{ item.priority | default(omit) }}"
  loop: "{{ _ceph_rpm_repos.get(ceph_repository, []) + _ceph_rpm_repos['epel'] }}"
  register: result
  until: result is succeeded
  when:
    - item.condition | default(true)

- name: Configure red hat custom repository
  ansible.builtin.copy:
    content: "{{ _ceph_uri_rpm_repo.content }}"
    dest: "/etc/yum.repos.d/{{ ceph_custom_repo | basename }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - ceph_repository == 'custom'

- name: Remove ceph_stable repositories
  ansible.builtin.yum_repository:
    name: '{{ item }}'
    file: ceph_stable
    state: absent
  with_items:
    - ceph_stable
    - ceph_stable_noarch
  when:
    - ceph_repository == 'dev'

# Remove yum caches so yum doesn't get confused if we are reinstalling a different ceph version
- name: Purge yum cache
  ansible.builtin.command: yum clean all # noqa: [303]
  changed_when: false
  when: ansible_facts['pkg_mgr'] == 'yum'
