---
- name: Install dependencies
  ansible.builtin.package:
    name: "{{ lookup('ansible.builtin.vars', ansible_facts['distribution'] | lower + '_package_dependencies', default=[]) }}"
    state: present
    enablerepo: "{{ (ansible_facts['distribution'] == 'Rocky') | ternary('crb', omit) }}"
  register: result
  until: result is succeeded

- name: Install redhat ceph packages
  ansible.builtin.package:
    name: "{{ redhat_ceph_pkgs | unique }}"
    state: "{{ (upgrade_ceph_packages | bool) | ternary('latest', 'present') }}"
  register: result
  until: result is succeeded
  when:
    - (ceph_origin == 'repository' or ceph_origin == 'distro')
