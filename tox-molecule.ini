[tox]
envlist = molecule-all-in-one
skipsdist = True

[testenv]
deps =
    -r{toxinidir}/tests/requirements.txt
    ansible-core=={env:ANSIBLE_VERSION:2.21}.*
passenv =
    CEPH_STABLE_RELEASE
    CEPH_REPOSITORY
    DOCKER_REGISTRY
    DOCKER_IMAGE_TAG
    DOCKER_COMMAND

[testenv:molecule-all-in-one]
commands =
    molecule test -s all_in_one
