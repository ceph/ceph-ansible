[tox]
envlist = molecule-all-in-one,molecule-upgrade,molecule-rbdmirror,molecule-container
skipsdist = True

[testenv]
deps =
    -r{toxinidir}/tests/requirements.txt
    ansible-core=={env:ANSIBLE_VERSION:2.21}.*
passenv =
    CEPH_STABLE_RELEASE
    CEPH_REPOSITORY
    DOCKER_REGISTRY
    DOCKER_IMAGE_TAG
    DOCKER_COMMAND

[testenv:molecule-all-in-one]
commands =
    molecule test -s all_in_one

[testenv:molecule-upgrade]
passenv =
    {[testenv]passenv}
    CEPH_INITIAL_RELEASE
    CEPH_TARGET_RELEASE
    CEPH_ANSIBLE_N1_BRANCH
    CEPH_ANSIBLE_N1_PATH
commands =
    molecule test -s upgrade

[testenv:molecule-rbdmirror]
commands =
    molecule test -s rbdmirror

[testenv:molecule-container]
commands =
    molecule test -s container
